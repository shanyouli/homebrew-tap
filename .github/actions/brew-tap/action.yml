name: Brew Tap
description: Trust the tap, install bump dependencies and set up the committer identity

inputs:
  HOMEBREW_GITHUB_API_TOKEN:
    description: 'Homebrew GitHub API Token'
    required: true

runs:
  using: 'composite'

  steps:
    - name: Add Tap
      env:
        HOMEBREW_GITHUB_API_TOKEN: ${{ inputs.HOMEBREW_GITHUB_API_TOKEN }}
      shell: bash -ieo pipefail {0}
      run: |
        brew tap shanyouli/tap

    - name: Install Homebrew's dependencies
      shell: bash -ieo pipefail {0}
      run: |
        # 只装脚本真正用到的工具：gcc/coreutils 与 bundler gems 预装都已移除
        # （brew bump-cask-pr 会自行安装它需要的 ast/style/audit gem 组）。
        brew install ripgrep sd parallel

    - name: Set up committer identity
      shell: bash -ieo pipefail {0}
      run: |
        # 推送凭证无需任何第三方 action：brew bump-cask-pr 会用
        # HOMEBREW_GITHUB_API_TOKEN 把 token 注入 push URL（见 Homebrew bump.rb
        # 的 add_auth_token_to_url!），这里只需要提交者身份。
        git config --global user.name 'shanyouli-Bot'
        git config --global user.email 'shanyouli-bot@aliyun.com'
        git config --global --get user.name
        git config --global --get user.email
