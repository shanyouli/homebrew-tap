name: Brew Tap

inputs:
  HOMEBREW_GITHUB_API_TOKEN:
    description: 'Homebrew GitHub API Token'
    required: true

runs:
  using: 'composite'

  steps:
    - name: Add Tap
      env:
        HOMEBREW_GITHUB_API_TOKEN: ${{ inputs.HOMEBREW_GITHUB_API_TOKEN }}
      shell: bash -ieo pipefail {0}
      run: |
        # 清掉上一步 brew update 可能残留的锁，避免
        # "Another `brew update` process is already running" 冲突。
        rm -rf "$(brew --prefix)/var/homebrew/locks/" 2>/dev/null || true
        brew tap shanyouli/tap
        # 不再额外 `brew update`：homebrew-env 刚更新过，`brew tap` 也只同步本 tap 仓库。

    - name: Install bump dependencies
      shell: bash -ieo pipefail {0}
      run: |
        # gcc/coreutils 与 audit/style 的 bundler gems 均未被使用：bottle 依赖由 brew
        # 自装，bump 命令需要的 gems 会由 brew 按需自行安装，去掉可省数分钟。
        brew install ripgrep sd parallel

    - name: Set up committer identity
      shell: bash -ieo pipefail {0}
      run: |
        # 推送凭证无需第三方 action：brew bump-cask-pr 会把 HOMEBREW_GITHUB_API_TOKEN
        # 注入 push URL（Homebrew 的 add_auth_token_to_url），这里只需提交者身份。
        git config --global user.name 'shanyouli-Bot'
        git config --global user.email 'shanyouli-bot@aliyun.com'
        git config --global --get user.name
        git config --global --get user.email
