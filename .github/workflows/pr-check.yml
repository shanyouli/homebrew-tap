name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# 同一个 PR 重复推送时取消上一次校验，避免排队堆积
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

# 离线语法/风格/审计校验，作为 PR 与 auto-merge 的门禁。
# 采用 Homebrew 官方 tap 模板（brew tap-new 生成）的写法：
#   $(brew --repo)/.github/workflows/tap-new-tests.yml
defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    if: github.repository_owner == 'shanyouli'
    # Linux 容器即可覆盖关键校验：cask stanza 能否加载、Linux 模拟下 sha256/macOS
    # 依赖声明是否合法（参见 AGENTS.md 中 brew readall 的说明）。
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
