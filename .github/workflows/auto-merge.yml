name: Auto Merge Owner PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_dispatch 没有 pull_request 上下文，必须排除，否则 gh pr merge 会拿到空编号
    if: github.event_name == 'pull_request' && github.actor == 'shanyouli'
    steps:
      # runner 已预装 gh CLI，本 job 也不使用工作区，因此无需 checkout / setup-gh-cli
      - name: Auto merge pull request
        run: gh pr merge "${{ github.event.pull_request.number }}" --merge --admin
        # 若已在仓库 Settings 打开 auto-merge 并把 pr-check 标记为 required check，
        # 可改为等校验通过再合并：gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
