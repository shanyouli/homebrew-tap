name: schedule

on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [fix-*]
  schedule:
    # Every 24 hours
    - cron: "0 2 */3 * *"
    # Every day at 6am
    # - cron: "0 6 * * *"
  # allow run manually
  workflow_dispatch:

# GITHUB_TOKEN 在本 workflow 只用于删除 bump- 分支；bump 提 PR/合并均走 HOMEBREW_GITHUB_API_TOKEN
permissions:
  contents: write

# 定时与手动触发重叠时会互删 bump- 分支、抢推同一分支：串行排队而非取消
concurrency:
  group: bump-${{ github.repository }}
  cancel-in-progress: false

jobs:
  casks:
    name: Bump Casks in parallel
    if: github.repository == 'shanyouli/homebrew-tap'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest]

    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Delete all remote bump- branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # refs API 默认每页 30 条，必须 --paginate，否则 bump- 分支超过 30 条时清不干净
          gh api --paginate repos/${{ github.repository }}/git/refs/heads \
            | jq -r '.[].ref' \
            | grep '^refs/heads/bump-' \
            | sed 's|refs/heads/||' \
            | xargs -L1 -I{} gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/{}
      - name: Homebrew env
        uses: ./.github/actions/homebrew-env
      - name: trust taps
        run: |
          brew trust shanyouli/tap
      - name: Brew Tap
        uses: ./.github/actions/brew-tap
        with:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Bump casks
        uses: ./.github/actions/bump-casks
        with:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: brew-autosquash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{secrets.HOMEBREW_GITHUB_API_TOKEN}}
        run: |
          brew pr-automerge --autosquash --tap shanyouli/tap
      - name: check brew bump caks error
        run: |
          if [[ -s ./error.log ]]; then
             echo "发现错误:"
             cat ./error.log
             exit 1
          fi

  check_formula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dir_exists: ${{ steps.check_dir.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v2 运行在已弃用的 Node16 上，升级以保持可用
      - name: Check if directory exists
        id: check_dir
        run: |
          if [ -d "./Formula" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  formulas:
    name: Bump Formulae in parallel
    needs: check_formula
    if: github.repository == 'shanyouli/homebrew-tap' && needs.check_formula.outputs.dir_exists == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest]

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Homebrew env
        uses: ./.github/actions/homebrew-env

      - name: Brew Tap
        uses: ./.github/actions/brew-tap
        with:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      # - name: Bump formulae
      #   uses: ./.github/actions/bump-formulas
      #   with:
      #     HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
